name: Research Lab tests

on:
  workflow_dispatch:
  push:
    branches: [main, research-lab, npc-data-blueprint, world-agent-pipeline, research-relations-memory-oasis, research-oasis-rounds, research-report-epistemic-loop, research-privacy-boundary, research-zep-world-ingestion, research-oasis-config-integration, research-runtime-flow]
  pull_request:
    branches: [main]

jobs:
  research-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Run full backend test suite
        run: pytest -q tests
