name: Research Lab tests

on:
  push:
    branches: [main, research-lab, npc-data-blueprint]
  pull_request:
    branches: [main]

jobs:
  research-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - name: Run isolated Research Lab unit tests
        run: |
          pytest -q \
            tests/test_research_source_semantics.py \
            tests/test_research_agent_seed_builder.py \
            tests/test_research_hierarchy.py
